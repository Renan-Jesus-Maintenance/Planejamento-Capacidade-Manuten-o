<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Horas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card-calculadora">

            <div class="menu-area">

                <button
                    type="button"
                    class="menu-btn"
                    id="menuBtn"
                    aria-label="Abrir menu"
                    aria-controls="menu"
                    aria-expanded="false">
                    <span aria-hidden="true">☰</span>
                </button>

                <nav id="menu" class="menu-lateral">
                    <a href="index.html">Calculadora de Horas</a>
                    <a href="escala.html">Escala Planejamento</a>
                    <a href="planejamento.html">Planejamento Manutenção</a>
                    <a href="sobre.html">Sobre</a>
                </nav>

            </div>

            <div class="banner">

                <img
                    src="assets/banner-industria.png"
                    alt="Imagem industrial">

                <div class="texto-banner">
                    <p>
                        Planejamento de recursos, cálculo de horas e apoio às operações de manutenção.
                    </p>
                </div>

            </div>

            <div class="card-header">
                <h1>Calculadora de Horas</h1>
            </div>

            <div class="conteudo-calculadora">

                <div class="inputs">

                    <div class="cabecalho">
                        <span>Horas</span>
                        <span>Minutos</span>
                    </div>

                    <div class="linha">
                        <input type="number" class="hora" min="0">
                        <span>:</span>
                        <input type="number" class="minuto" min="0" max="59">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora" min="0">
                        <span>:</span>
                        <input type="number" class="minuto" min="0" max="59">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora" min="0">
                        <span>:</span>
                        <input type="number" class="minuto" min="0" max="59">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora" min="0">
                        <span>:</span>
                        <input type="number" class="minuto" min="0" max="59">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora" min="0">
                        <span>:</span>
                        <input type="number" class="minuto" min="0" max="59">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora" min="0">
                        <span>:</span>
                        <input type="number" class="minuto" min="0" max="59">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora" min="0">
                        <span>:</span>
                        <input type="number" class="minuto" min="0" max="59">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora" min="0">
                        <span>:</span>
                        <input type="number" class="minuto" min="0" max="59">
                    </div>

                    <div class="linha">
                        <input type="number" class="hora" min="0">
                        <span>:</span>
                        <input type="number" class="minuto" min="0" max="59">
                    </div>

                </div>

                <div class="resultado-container">

                    <h2>Resultado</h2>

                    <div id="resultado">00:00</div>

                    <button type="button" id="btnLimpar">
                        Limpar
                    </button>

                </div>

            </div>

            <div class="assinatura">

                <img
                    src="assets/logo-gm.png"
                    alt="Logo GM"
                    class="logo-gm">

                <span>
                    © 2026 Renan de Jesus | Calculadora de Horas V1.8
                </span>

                <img
                    src="assets/logo-manutencao.png"
                    alt="Logo Manutenção"
                    class="logo-manutencao">

            </div>

            <a href="sobre.html" class="btn-sobre">
                Sobre o Projeto
            </a>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
